name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.6.0)'
        required: true
        default: 'v2.6.0'

jobs:
  buildRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Read Go version from project
      run: echo "GO_VERSION=$(grep -E \"^de\\.felixnuesse\\.extract\\.goVersion=\" gradle.properties | cut -d'=' -f2)"
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Go from gradle.properties
      uses: actions/setup-go@v4
      with:
        go-version: '${{env.GO_VERSION}}'
        id: go
    - name: Setup Android SDK/NDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install NDK from gradle.properties
      run: |
        NDK_VERSION="$(grep -E \"^de\\.felixnuesse\\.extract\\.ndkVersion=\" gradle.properties | cut -d'=' -f2)"
        sdkmanager "ndk;${NDK_VERSION}"
    - name: Restore release keystore
      run: |
        mkdir -p app/.config/android
        echo "${{ secrets.ROUNDSYNC_KEYSTORE_BASE64 }}" | base64 -d > app/.config/android/roundsync.keystore
    - name: Build signed release APKs
      env:
        ROUNDSYNC_KEY_ALIAS: ${{ secrets.ROUNDSYNC_KEY_ALIAS }}
        ROUNDSYNC_STORE_PASSWORD: ${{ secrets.ROUNDSYNC_STORE_PASSWORD }}
        ROUNDSYNC_KEY_PASSWORD: ${{ secrets.ROUNDSYNC_KEY_PASSWORD }}
      run: ./gradlew assembleOssRelease
    - name: Rename APKs
      run: |
        VERSION=$(grep -E "versionName" app/build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
        OUT=app/build/outputs/apk/oss/release
        ls $OUT
        for f in $OUT/*-oss-arm64-v8a-release.apk; do
          cp "$f" "$OUT/RoundSync-v${VERSION}-arm64-v8a.apk"
        done
        for f in $OUT/*-oss-universal-release.apk; do
          cp "$f" "$OUT/RoundSync-v${VERSION}-universal.apk"
        done
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_tag }}
        files: |
          app/build/outputs/apk/oss/release/RoundSync-*-arm64-v8a.apk
          app/build/outputs/apk/oss/release/RoundSync-*-universal.apk
